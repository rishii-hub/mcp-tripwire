[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tripwire"
version = "0.1.0"
description = "Safety testing and reliability CI for AI agents using MCP servers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vivek Sheel Rishi" }]
keywords = ["mcp", "ai-agents", "testing", "safety", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "mcp[cli]>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "anthropic>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
tripwire = "mcp_tripwire.cli:app"

[project.urls]
Homepage = "https://github.com/rishii-hub/mcp-tripwire"
Repository = "https://github.com/rishii-hub/mcp-tripwire"

[tool.hatch.build.targets.wheel]
packages = ["mcp_tripwire"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM"]
# T20 bans print() — this is deliberate. stdout belongs to the MCP protocol.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running target MCP server",
]
